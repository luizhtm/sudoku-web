<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sudoku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Sudoku</h1>
      <div id="difficulty-bar">
        <button class="diff-btn active" data-diff="easy">Fácil</button>
        <button class="diff-btn" data-diff="medium">Médio</button>
        <button class="diff-btn" data-diff="hard">Difícil</button>
      </div>
    </header>

    <div id="status-bar">
      <div id="timer">00:00</div>
      <div id="erase-counter">Apagadas: 0</div>
    </div>

    <div id="mode-bar">
      <button class="mode-btn active" data-mode="definitive">
        <span class="mode-icon">D</span>
        <span class="mode-label">Definitivo</span>
      </button>
      <button class="mode-btn" data-mode="pencil">
        <span class="mode-icon">✎</span>
        <span class="mode-label">Rascunho</span>
      </button>
    </div>

    <div id="board-container">
      <div id="board"></div>
    </div>

    <div id="numpad">
      <button class="num-btn" data-num="1">1</button>
      <button class="num-btn" data-num="2">2</button>
      <button class="num-btn" data-num="3">3</button>
      <button class="num-btn" data-num="4">4</button>
      <button class="num-btn" data-num="5">5</button>
      <button class="num-btn" data-num="6">6</button>
      <button class="num-btn" data-num="7">7</button>
      <button class="num-btn" data-num="8">8</button>
      <button class="num-btn" data-num="9">9</button>
    </div>

    <div id="action-bar">
      <button id="new-game-btn">Novo Jogo</button>
      <button id="restart-btn">Reiniciar</button>
      <button id="highscores-btn">High Scores</button>
    </div>

    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <div id="modal-header">
          <h2 id="modal-title"></h2>
          <button id="modal-close">&times;</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
